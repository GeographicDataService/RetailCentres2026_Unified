<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Centre Audit</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --yes:#15803d; --no:#b91c1c; --unsure:#a16207; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1917; --panel:#292524; --ink:#f5f5f4; --muted:#a8a29e; --line:#44403c; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); display:grid; grid-template-columns:1fr 380px; height:100vh; }
  #map { height:100vh; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:16px; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .muted { color:var(--muted); font-size:12px; }
  .q { font-size:16px; font-weight:600; padding:10px; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td { border-bottom:1px solid var(--line); padding:3px 4px; vertical-align:top; }
  td:first-child { color:var(--muted); width:45%; }
  .btns { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.sel { color:#fff; }
  button.yes.sel { background:var(--yes); } button.no.sel { background:var(--no); } button.unsure.sel { background:var(--unsure); }
  textarea, input[type=text], select { width:100%; font:inherit; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .nav { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .bar > div { height:100%; background:var(--accent); }
  .saved { color:var(--yes); font-size:12px; min-height:16px; }
  a { color:var(--accent); }
  kbd { border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:11px; }
  @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows:55vh auto; height:auto; } #map { height:55vh; } aside { border-left:0; } }
</style>
</head>
<body>
<div id="map"></div>
<aside>
  <div>
    <h1 id="title">Loading…</h1>
    <div class="muted" id="sub"></div>
  </div>
  <div class="bar"><div id="prog" style="width:0"></div></div>
  <div class="muted" id="progtxt"></div>
  <div class="q" id="question"></div>
  <table id="metrics"></table>
  <div class="muted" id="links"></div>
  <div class="btns">
    <button class="yes" data-l="yes">Yes <kbd>y</kbd></button>
    <button class="no" data-l="no">No <kbd>n</kbd></button>
    <button class="unsure" data-l="unsure">Unsure <kbd>u</kbd></button>
  </div>
  <textarea id="notes" rows="3" placeholder="Notes (saved with the label)"></textarea>
  <label><input type="checkbox" id="paper"> Paper example <kbd>p</kbd></label>
  <div class="saved" id="saved"></div>
  <div class="nav">
    <button id="prev">◀ Prev <kbd>←</kbd></button>
    <button id="nextun">Next unlabelled <kbd>space</kbd></button>
    <button id="next">Next ▶ <kbd>→</kbd></button>
  </div>
  <select id="filter"><option value="">All strata</option></select>
  <input type="text" id="labeller" placeholder="Labeller initials">
  <div class="muted">Labels are saved to <code>labels.csv</code> on every click; the latest label per case wins. Protocol: <a href="/protocol" target="_blank">audit/README.md</a>.</div>
</aside>
<script>
const QUESTIONS = {
  landuse_removal: "Is this a retail centre?",
  merge: "Do the two parts form one continuous retail centre?",
  retail_park: "Is this a retail park?",
  landuse_kept: "Is this a retail centre?",
  landuse_poi_exempt: "Is this a retail centre?",
  missing_top: "Is there a functioning retail centre here today?",
  missing_slc: "Is there a functioning retail centre here today?",
  park_ratio_gained: "Is this a retail park?",
  park_ratio_lost: "Is this a retail park?",
  landuse_kept_near: "Is this a retail centre?",
  landuse_removal_near: "Is this a retail centre?",
  exempt_kept_near: "Is this a retail centre?",
  exempt_removed_near: "Is this a retail centre?",
};
const CTX_STYLE = { network_a: { color: "#38bdf8" }, network_b: { color: "#f472b6" }, bridge: { color: "#facc15", fillOpacity: 0.6 } };
const map = L.map("map");
const imagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 20, maxNativeZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" }).addTo(map);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 20, maxNativeZoom: 19, attribution: "© OpenStreetMap contributors" });
L.control.layers({ "Imagery": imagery, "OpenStreetMap": osm }).addTo(map);
let layer = L.layerGroup().addTo(map);
let cases = [], ctx = {}, pts = {}, labels = {}, view = [], i = 0, current = null;
const $ = id => document.getElementById(id);
try { $("labeller").value = localStorage.getItem("labeller") || ""; } catch (e) {}
$("labeller").onchange = () => { try { localStorage.setItem("labeller", $("labeller").value); } catch (e) {} };

async function load() {
  const fc = await (await fetch("/cases.geojson")).json();
  cases = fc.features;
  (fc.context?.features || []).forEach(f => (ctx[f.properties.case_id] ||= []).push(f));
  (fc.brand_points?.features || []).forEach(f => (pts[f.properties.case_id] ||= []).push(f));
  labels = await (await fetch("/labels")).json();
  [...new Set(cases.map(c => c.properties.stratum))].forEach(s => $("filter").add(new Option(s, s)));
  applyFilter();
  const firstUn = view.findIndex(c => !labels[c.properties.case_id]);
  show(firstUn < 0 ? 0 : firstUn);
}
function applyFilter() { const s = $("filter").value; view = cases.filter(c => !s || c.properties.stratum === s); }
function show(k) {
  if (!view.length) return;
  i = (k + view.length) % view.length; current = view[i];
  const p = current.properties, m = JSON.parse(p.metrics), lab = labels[p.case_id];
  $("title").textContent = p.case_id;
  $("sub").textContent = `${p.stratum} · ${p.ref_id}`;
  $("question").textContent = QUESTIONS[p.stratum];
  $("metrics").innerHTML = Object.entries(m).map(([k, v]) => `<tr><td>${k}</td><td>${v ?? "—"}</td></tr>`).join("");
  $("links").innerHTML = `<a target="_blank" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}">Street View</a> · ` +
    `<a target="_blank" href="https://www.google.com/maps/@${p.lat},${p.lon},150m/data=!3m1!1e3">Google satellite</a> · ` +
    `<a target="_blank" href="https://www.openstreetmap.org/#map=18/${p.lat}/${p.lon}">OSM</a>`;
  $("notes").value = lab?.notes || ""; $("paper").checked = lab?.paper_example === "1";
  document.querySelectorAll(".btns button").forEach(b => b.classList.toggle("sel", lab?.label === b.dataset.l));
  $("saved").textContent = lab ? `Saved ${lab.label} at ${lab.timestamp}` : "";
  layer.clearLayers();
  (ctx[p.case_id] || []).forEach(f => L.geoJSON(f, { style: { weight: 2, fillOpacity: 0.15, ...CTX_STYLE[f.properties.role] } }).addTo(layer));
  const main = L.geoJSON(current, { style: { color: "#ef4444", weight: 3, fill: false, dashArray: ctx[p.case_id] ? "6 4" : null } }).addTo(layer);
  const brands = pts[p.case_id] || [];
  brands.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    L.circleMarker([lat, lon], { radius: 6, color: "#fff", weight: 2, fillColor: "#f59e0b", fillOpacity: 1 })
      .bindTooltip(f.properties.name, { permanent: brands.length <= 10, direction: "top", offset: [0, -6] }).addTo(layer);
  });
  map.fitBounds(main.getBounds(), { padding: [60, 60], maxZoom: 18 });
  const done = cases.filter(c => labels[c.properties.case_id]).length;
  $("prog").style.width = `${100 * done / cases.length}%`;
  $("progtxt").textContent = `${done} / ${cases.length} labelled · case ${i + 1} of ${view.length}${$("filter").value ? " in " + $("filter").value : ""}`;
}
async function save(label) {
  if (!current) return;
  const p = current.properties;
  label ||= labels[p.case_id]?.label;
  if (!label) { $("saved").textContent = "Pick Yes / No / Unsure first"; return; }
  const body = { case_id: p.case_id, stratum: p.stratum, label, notes: $("notes").value, paper_example: $("paper").checked, labeller: $("labeller").value };
  const r = await fetch("/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { $("saved").textContent = "Save failed: " + await r.text(); return; }
  labels[p.case_id] = await r.json(); labels[p.case_id].paper_example = String(labels[p.case_id].paper_example);
  show(i);
}
function nextUnlabelled() { for (let k = 1; k <= view.length; k++) { const j = (i + k) % view.length; if (!labels[view[j].properties.case_id]) return show(j); } }
document.querySelectorAll(".btns button").forEach(b => b.onclick = () => save(b.dataset.l));
$("paper").onchange = () => save();
$("notes").onchange = () => save();
$("prev").onclick = () => show(i - 1); $("next").onclick = () => show(i + 1); $("nextun").onclick = nextUnlabelled;
$("filter").onchange = () => { applyFilter(); show(0); };
document.addEventListener("keydown", e => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === "y") save("yes"); else if (k === "n") save("no"); else if (k === "u") save("unsure");
  else if (k === "p") { $("paper").checked = !$("paper").checked; save(); }
  else if (e.key === "ArrowRight") show(i + 1); else if (e.key === "ArrowLeft") show(i - 1);
  else if (e.key === " ") { e.preventDefault(); nextUnlabelled(); }
});
load();
</script>
</body>
</html>
